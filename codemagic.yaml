
workflows:
  couturepro-android-release:
    name: CouturePro - APK Android signé
    max_build_duration: 60

    environment:
      node: 22
      java: 21
      android_signing:
        - couturepro_release

    scripts:
      - name: Installer les dépendances
        script: npm install

      - name: Compiler l'application Web
        script: npm run build

      - name: Générer Android
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Générer les icônes Android
        script: npx capacitor-assets generate --android

      - name: Synchroniser Android
        script: npx cap sync android

      - name: Configurer la signature
        script: node scripts/configure-android-signing.mjs

      - name: Compiler APK signé
        script: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
